# Development database only: PostgreSQL 18 with pgvector on localhost:55432.
#   docker compose -f deploy/compose.dev.yaml up -d
# DATABASE_URL=postgres://antibody:antibody@localhost:55432/antibody
name: antibody-dev
services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    # The Rust test suite creates one database and pool per test in parallel.
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_USER: antibody
      POSTGRES_PASSWORD: antibody
      POSTGRES_DB: antibody
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - antibody-dev-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antibody -d antibody"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  antibody-dev-pg:
